plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.ping.verbead'
    compileSdk 35

    defaultConfig {
        applicationId "com.ping.verbead"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            pseudoLocalesEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // LiteRT 2.3.x is compiled with Kotlin 2.4 metadata; this project's compiler is 2.2
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
    buildFeatures { viewBinding true; buildConfig true }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        pickFirst 'lib/*/libc++_shared.so'
    }

    lint {
        // 防倒退：新增寫死的介面文字會讓 lint 失敗；現有違規記在 baseline，只許減少
        error 'HardcodedText', 'MissingTranslation', 'ExtraTranslation'
        baseline = file('lint-baseline.xml')
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.recyclerview
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.lifecycle.runtime.ktx

    // CameraX
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view

    // LiteRT (CompiledModel, GPU first / CPU fallback) for PP-OCRv6 detection & recognition
    implementation libs.litert
    implementation libs.litert.gpu

    // ZXing C++ barcode reader
    implementation files('libs/zxingcpp-release.aar')

    // Qwen3 ASR via sherpa-onnx AAR (drop sherpa-onnx-<version>.aar into app/libs/)
    implementation(name: 'sherpa-onnx-2.0.1', ext: 'aar')

    // OpenCC — Simplified → Traditional Chinese
    implementation libs.opencc4j

    // tar.bz2 extraction for downloaded Qwen3-ASR model archive
    implementation libs.commons.compress

    testImplementation libs.junit
    testImplementation "org.json:json:20231013"
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.ext.junit
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.12.0"
        force "androidx.core:core-ktx:1.12.0"
    }
}
